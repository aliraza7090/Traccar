version: 0.2

# CodeBuild path: build the Traccar image and push to ECR.
# CodeBuild's standard Linux image is x86_64, so `docker build` here produces an
# amd64 image natively — exactly what Amazon Linux 2 x86_64 EC2 needs. (Use
# build-and-push.sh instead when building locally on an M1 Mac.)
#
# Project requirements:
#   - Privileged mode ENABLED (Docker builds)
#   - Service role allowed to auth/push to ECR
# Env vars to set on the project:
#   AWS_ACCOUNT_ID, AWS_DEFAULT_REGION (ca-central-1), IMAGE_REPO_NAME (traccar),
#   CONTAINER_NAME (traccar — must match the name in ecs-task-definition.json)

phases:
  pre_build:
    commands:
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}; IMAGE_TAG=${IMAGE_TAG:0:8}

  build:
    commands:
      - docker build -t $REPO_URI:$IMAGE_TAG -t $REPO_URI:latest .

  post_build:
    commands:
      - docker push $REPO_URI:$IMAGE_TAG
      - docker push $REPO_URI:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPO_URI:$IMAGE_TAG" > imagedefinitions.json
      - echo Pushed $REPO_URI:$IMAGE_TAG

artifacts:
  files:
    - imagedefinitions.json
